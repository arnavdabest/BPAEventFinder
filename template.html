<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BPA Event Matcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#00476B;--navy-dark:#00263E;--red:#A72B2A;--red-dark:#8c2322;--gold:#C6AA76;--sky:#C1D5EB;--sky-light:#E8EEF4;
        --bg:#F6F5F3;--card:#fff;--text:#4A4A4A;--heading:#00263E;--muted:#6b7280;--border:#E5E7EB}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  .topbar{background:#fff;border-bottom:1px solid var(--border);border-top:4px solid var(--navy)}
  .topbar .in{max-width:560px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
  .topbar img{height:40px;width:auto}
  .topbar .fallback{font-family:"Josefin Sans",sans-serif;font-weight:700;color:var(--navy);font-size:1.3rem;letter-spacing:.5px}
  .topbar .sub{margin-left:auto;font-family:"Josefin Sans",sans-serif;font-weight:600;color:var(--navy);font-size:.95rem;text-transform:uppercase;letter-spacing:1px}
  .wrap{max-width:560px;margin:0 auto;padding:24px 16px 48px}
  h1,h2,h3{font-family:"Josefin Sans",sans-serif;color:var(--heading);line-height:1.2}
  h1{font-size:1.9rem;margin:0 0 10px;font-weight:700}
  h2{font-size:1.35rem;margin:0 0 16px;font-weight:600}
  p{margin:0 0 14px;color:var(--text)}
  .btn{display:block;width:100%;padding:14px 16px;margin:8px 0;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--heading);font-size:1rem;text-align:left;cursor:pointer;font-family:inherit;transition:border-color .15s,background .15s}
  .btn:hover{border-color:var(--navy)}
  .btn:active{background:var(--sky-light)}
  .btn.sel{border-color:var(--navy);background:var(--sky-light);box-shadow:inset 0 0 0 1px var(--navy)}
  .btn.primary{background:var(--red);color:#fff;border-color:var(--red);text-align:center;font-weight:600;letter-spacing:.3px}
  .btn.primary:hover{background:var(--red-dark)}
  .btn.primary:disabled{opacity:.45;cursor:default}
  .btn.link{display:inline-block;width:auto;padding:8px 16px;margin:14px auto 0;font-size:.85rem;text-align:center;color:var(--navy);text-decoration:none;border:1px solid var(--sky);background:transparent;font-weight:600}
  .btn.link:hover{border-color:var(--navy);background:var(--sky-light)}
  .center{text-align:center}
  .btn.ghost{text-align:center;color:var(--navy);font-weight:600;background:transparent;border-color:var(--navy)}
  .progress{height:6px;background:var(--sky);border-radius:3px;margin:0 0 20px;overflow:hidden}
  .progress div{height:100%;background:var(--navy);transition:width .25s}
  .step{font-family:"Josefin Sans",sans-serif;font-size:.8rem;color:var(--navy);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
  .card{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--navy);border-radius:12px;padding:16px 18px;margin:12px 0}
  .card h3{margin:0 0 8px;font-size:1.1rem;font-weight:700}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
  .tag{font-size:.72rem;padding:4px 10px;border-radius:999px;background:var(--sky-light);color:var(--navy);font-weight:700;letter-spacing:.3px;text-transform:uppercase}
  .tag.gold{background:#f3ead7;color:#7a5f2a}
  .why{font-size:.88rem;color:var(--text);margin-top:10px;padding:10px 12px;background:var(--bg);border-radius:8px}
  .why b{color:var(--heading)}
  .cat{margin:26px 0 8px;font-family:"Josefin Sans",sans-serif;font-size:1rem;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid var(--gold);padding-bottom:4px}
  .small{font-size:.9rem}
  .hidden{display:none}
  .code{font-weight:400;color:var(--muted);font-size:.85rem;font-family:inherit}
  .muted{color:var(--muted)}
  details{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}
  summary{cursor:pointer;color:var(--red);font-weight:700;font-size:.88rem;text-transform:uppercase;letter-spacing:.5px;font-family:"Josefin Sans",sans-serif}
  dl{margin:10px 0 6px;font-size:.88rem}
  dt{font-weight:700;margin-top:10px;color:var(--heading)}
  dd{margin:2px 0 0}
  dd ul{margin:4px 0 0;padding-left:18px}
  a{color:var(--navy)}
  .footer{max-width:560px;margin:0 auto;padding:0 16px 32px;font-size:.78rem;color:var(--muted);text-align:center}
  .hero{background:var(--navy-dark);color:#fff;border-radius:14px;padding:28px 22px;margin-bottom:18px;position:relative;overflow:hidden}
  .hero:before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:var(--navy);opacity:.6}
  .hero h1{color:#fff;position:relative}
  .hero p{color:var(--sky);position:relative;margin:0}
  .hero .kicker{font-family:"Josefin Sans",sans-serif;color:var(--gold);text-transform:uppercase;letter-spacing:2px;font-size:.75rem;font-weight:700;margin-bottom:8px;position:relative}
</style>
</head>
<body>
<div class="topbar"><div class="in">
  <a href="https://bpa.org/" target="_blank" rel="noopener" aria-label="Business Professionals of America"><img src="logo.png" alt="Business Professionals of America" onerror="this.outerHTML='<span class=fallback>BPA</span>'"></a>
  <span class="sub">Event Matcher</span>
</div></div>
<div class="wrap" id="app"></div>
<div class="footer">Chapter-built tool, not an official BPA site. Event data from the BPA Workplace Skills Assessment Program "Events at a Glance" (Sept 2026). Official guidelines at <a href="https://bpa.org/" target="_blank" rel="noopener">bpa.org</a>.</div>
<script>
const EVENTS = /*EVENTS*/;
const GUIDELINES_URL = "https://bpa.org/students/wsap/";

// ---------- tagging ----------
const SUBJ = {finance:"Money, investing & accounting", business:"Business, management & office skills", startup:"Startups, pitching & entrepreneurship",
  it:"Coding, networks & cybersecurity", games:"Games, animation & 3D", design:"Graphic design, video, photo & audio",
  marketing:"Marketing, branding & social media", health:"Healthcare", comm:"Public speaking, interviews & career skills"};
const CAT_SUBJ = {"Finance":["finance"],"Business Admin & Management":["business"],"IT & Computer Science":["it"],"Digital Media & Design":["design"],"Marketing & Sales":["marketing"],"Health Administration":["health"],"Communication & Career Skills":["comm"]};
const SUBJ_OVERRIDE = {
  V01:["design","marketing"],V02:["design","marketing"],V03:["games","it"],V04:["it"],V05:["it","design"],V06:["design"],V07:["it"],
  V08:["startup","business"],V09:["finance"],V10:["marketing","design"],V11:["games","design"],V12:["marketing"],V13:["games","marketing"],
  V14:["business"],V15:["comm"],V16:["it"],
  "240":["startup","business"],"245":["business","startup"],"510":["startup","marketing"],"425":["games","design"],"440":["games","design"],
  "455":["design","it"],"365":["it","design"],"360":["it","design"],"150":["finance","business"],"155":["finance"],"160":["finance"],
  "235":["business"],"755":["comm"],"760":["comm"],"725":["comm"],"730":["comm"],"745":["comm","business"],"750":["comm","business"]};
const FMT_LABEL = {test:"Objective test",production:"Hands-on computer test",project:"Pre-submitted project + presentation",live:"Live judged, on-site prep"};

for (const e of EVENTS) {
  e.subjects = SUBJ_OVERRIDE[e.code] || CAT_SUBJ[e.category] || [];
  e.judges = (e.format === "project" || e.format === "live") ? "yes" : "no";
  e.ownComputer = String(!!e.ownComputer); e.cert = String(!!e.cert);
  const n = e.name.toLowerCase();
  e.level = /advanced/.test(n) ? "advanced"
          : /fundamental|essential|concepts|\(open\)|^interview skills|personal financial|extemporaneous/.test(n) ? "beginner" : "intermediate";
}
const VISIBLE = EVENTS.filter(e => e.division !== "PS");

// ---------- quiz ----------
// Each option carries w: {dimension: {eventTagValue: points}} and why: {eventTagValue: "reason shown on the card"}.
const QUESTIONS = [
 {id:"format", q:"Which of these sounds most like you?", opts:[
   {t:"Sit down and take a test. No judges, no project.", w:{format:{test:4, production:1}}, why:{test:"you'd rather just take a test"}},
   {t:"Build something at a computer, on the clock", w:{format:{production:4, test:1}}, why:{production:"you want to build something on the clock"}},
   {t:"Spend a few weeks making something, then show it off", w:{format:{project:4, live:1}}, why:{project:"you want to make a real project and show it off"}},
   {t:"Get a scenario on the spot and present it", w:{format:{live:4, project:1}}, why:{live:"you like thinking on your feet"}},
   {t:"Honestly, I'm not sure yet", w:{}, why:{}}]},
 {id:"judges", q:"Presenting in front of a panel of judges. How does that sound?", opts:[
   {t:"Love it, that's the fun part", w:{judges:{yes:3}}, why:{yes:"you like presenting to judges"}},
   {t:"Nervous, but I'd do it", w:{judges:{yes:1}}, why:{}},
   {t:"Fine either way", w:{}, why:{}},
   {t:"Hard pass", w:{judges:{no:3, yes:-3}}, why:{no:"no judges involved"}}]},
 {id:"team", q:"Solo or with a team?", opts:[
   {t:"Solo. I'll own the whole thing.", w:{team:{individual:3, team:-3}}, why:{individual:"it's a solo event"}},
   {t:"Team. I work better with people.", w:{team:{team:3, individual:-3}}, why:{team:"it's a team event"}},
   {t:"Team, but only if I already have people", w:{team:{team:2}}, why:{team:"it's a team event"}},
   {t:"Either is fine", w:{}, why:{}}]},
 {id:"subjects", q:"What are you into? Pick up to 3.", multi:true, max:3,
   opts:Object.entries(SUBJ).map(([v,t])=>({t,v}))},
 {id:"prep", q:"How much time do you want to put in before the conference?", opts:[
   {t:"Whatever it takes. I want to win.", w:{prep:{high:3, medium:1}}, why:{high:"it rewards people who go all in"}},
   {t:"A solid few weekends", w:{prep:{high:2, medium:2}}, why:{high:"it's a project you build over a few weeks", medium:"a few weekends of prep is enough"}},
   {t:"A few hours of studying or practicing", w:{prep:{medium:3, low:1, high:-2}}, why:{medium:"a few hours of prep is enough"}},
   {t:"I'll study, but I don't want a whole project", w:{prep:{low:2, medium:2}, format:{project:-3}}, why:{low:"it needs little prep", medium:"studying is all it takes"}},
   {t:"Minimal. I'll wing it.", w:{prep:{low:3, medium:-1, high:-3}}, why:{low:"it needs almost no prep beforehand"}}]},
 {id:"year", q:"What year are you in BPA?", opts:[
   {t:"First year, just joined", w:{level:{beginner:2, advanced:-1}, prep:{high:-1}}, why:{beginner:"it's a solid first-year event"}},
   {t:"Second year", w:{level:{intermediate:1}}, why:{}},
   {t:"Third year or more", w:{level:{advanced:1, intermediate:1}, format:{project:1, live:1}}, why:{advanced:"it suits a BPA veteran"}},
   {t:"Not a member yet, just curious", w:{level:{beginner:1}}, why:{}}]},
 {id:"classes", q:"Which of these have you taken (or are taking)? Pick all that apply.", multi:true, max:9, pts:2, prefix:"you've taken a class in", opts:[
   {t:"Accounting, finance, or economics", v:"finance"},
   {t:"Intro to business or management", v:"business"},
   {t:"Entrepreneurship", v:"startup"},
   {t:"Computer science, programming, or networking", v:"it"},
   {t:"Game design or animation", v:"games"},
   {t:"Graphic design, video, photo, or audio", v:"design"},
   {t:"Marketing", v:"marketing"},
   {t:"Health science or medical terminology", v:"health"},
   {t:"Public speaking, debate, or journalism", v:"comm"}]},
 {id:"laptop", q:"Do you have a laptop you could bring to the conference?", opts:[
   {t:"Yes, with the software I'd need", w:{}, why:{}},
   {t:"Yes, but it's basic (school Chromebook)", w:{ownComputer:{true:-1}}, why:{}},
   {t:"No", w:{ownComputer:{true:-4, false:1}}, why:{false:"you don't need to bring a computer"}}]},
 {id:"cert", q:"Some events come with an industry certification you can put on a resume (Microsoft, CompTIA, etc.). Interested?", opts:[
   {t:"Yes, that would be a big plus", w:{cert:{true:3}}, why:{true:"it comes with a certification"}},
   {t:"Nice to have, not a priority", w:{cert:{true:1}}, why:{true:"it comes with a certification"}},
   {t:"Don't care", w:{}, why:{}}]},
 {id:"level", q:"How would you describe your experience?", opts:[
   {t:"Total beginner, keep it simple", w:{level:{beginner:2, advanced:-2}}, why:{beginner:"it's beginner-friendly"}},
   {t:"I've done some of this before", w:{level:{intermediate:2}}, why:{intermediate:"it's a good middle-ground challenge"}},
   {t:"I'm pretty good at this stuff", w:{level:{intermediate:1, advanced:2}}, why:{advanced:"it's one of the tougher events"}},
   {t:"Give me the hardest one", w:{level:{advanced:3, beginner:-2}}, why:{advanced:"it's one of the tougher events"}}]},
];

function score(e, a) {
  let s = 0; const why = [];
  for (const q of QUESTIONS) {
    const ans = a[q.id]; if (ans == null) continue;
    if (q.multi) {
      const hits = e.subjects.filter(x => ans.includes(x));
      s += (q.pts || 3) * hits.length;
      if (hits.length) why.push((q.prefix || "it's about") + " " + hits.map(h => SUBJ[h].toLowerCase()).join(" and "));
      continue;
    }
    const opt = q.opts[ans];
    for (const [dim, table] of Object.entries(opt.w)) {
      const v = e[dim]; if (v in table) s += table[v];
      const r = opt.why[v]; if (r && table[v] > 0 && !why.includes(r)) why.push(r);
    }
  }
  return {s, why};
}

function match(a) {
  const ranked = VISIBLE.map(e => ({e, ...score(e, a)})).sort((x,y) => y.s - x.s);
  const out = [], perCat = {};
  for (const r of ranked) {
    if (out.length >= 5) break;
    if (r.e.category === "Virtual Events" && (perCat[r.e.category] || 0) >= 2) continue; // max 2 virtual so in-person events show
    if (out.length >= 3 && r.s < out[0].s * 0.8) break;    // drop weak tail matches
    out.push(r); perCat[r.e.category] = (perCat[r.e.category] || 0) + 1;
  }
  return out;
}

// ---------- UI ----------
const app = document.getElementById("app");
let answers = {}, idx = 0, multiSel = [];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function landing() {
  answers = {}; idx = 0;
  app.innerHTML = `<div class="hero"><div class="kicker">Workplace Skills Assessment Program</div><h1>Which BPA event fits you?</h1>
   <p>Answer 10 quick questions and get your top event picks. Takes about 2 minutes.</p></div>
   <button class="btn primary" id="start">Start</button>
   <button class="btn ghost" id="all">Just show me all the events</button>
   <div class="center"><a class="btn link" href="https://bpa.org/" target="_blank" rel="noopener">What's BPA?</a></div>`;
  document.getElementById("start").onclick = () => question();
  document.getElementById("all").onclick = () => showAll(landing);
}

function question() {
  const q = QUESTIONS[idx]; multiSel = q.multi ? (answers[q.id] || []).slice() : [];
  app.innerHTML = `<div class="step">Question ${idx+1} of ${QUESTIONS.length}</div>
    <div class="progress"><div style="width:${idx/QUESTIONS.length*100}%"></div></div>
    <h2>${esc(q.q)}</h2>
    <div id="opts">${q.opts.map((o,i)=>`<button class="btn${q.multi && multiSel.includes(o.v) ? " sel" : ""}" data-i="${i}">${esc(o.t)}</button>`).join("")}</div>
    ${q.multi ? `<button class="btn primary" id="next" ${multiSel.length ? "" : "disabled"}>Next</button>` : ""}
    ${idx>0 ? `<button class="btn ghost" id="back">Back</button>` : ""}`;
  document.querySelectorAll("#opts .btn").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if (!q.multi) { answers[q.id] = i; advance(); return; }
    const v = q.opts[i].v;
    if (multiSel.includes(v)) { multiSel = multiSel.filter(x=>x!==v); b.classList.remove("sel"); }
    else if (multiSel.length < q.max) { multiSel.push(v); b.classList.add("sel"); }
    document.getElementById("next").disabled = multiSel.length === 0;
  });
  const n = document.getElementById("next"); if (n) n.onclick = () => { answers[q.id] = multiSel.slice(); advance(); };
  const bk = document.getElementById("back"); if (bk) bk.onclick = () => { idx--; question(); };
}

function advance() { idx++; idx < QUESTIONS.length ? question() : results(); }

function card(e, why) {
  const d = e.detail || {};
  const team = e.team === "team" ? "Team" + (e.teamSize ? " of " + e.teamSize.split(" ")[0] : "") : "Solo";
  const ex = (d.examples && d.examples.length)
    ? `<ul>${d.examples.map(x => `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>${x.note ? " – " + esc(x.note) : ""}</li>`).join("")}</ul>`
    : `<span class="muted">None added yet. Ask a chapter officer to see past entries.</span>`;
  return `<div class="card"><h3>${esc(e.name)} <span class="code">#${esc(e.code)}</span></h3>
    <div class="tags"><span class="tag">${esc(FMT_LABEL[e.format])}</span><span class="tag">${team}</span><span class="tag">${esc(e.category)}</span>${e.cert === "true" ? '<span class="tag gold">Certification</span>' : ""}${e.ownComputer === "true" ? '<span class="tag">Bring laptop</span>' : ""}</div>
    <div class="small">${esc(e.description)}</div>
    ${why ? `<div class="why"><b>Why this matched you:</b> ${esc(why)}.</div>` : ""}
    <details><summary>More about this event</summary>
      <dl>
        <dt>What you actually make or do</dt><dd>${esc(d.make || "")}</dd>
        <dt>What it's scored on</dt><dd>${esc(d.look || "")}</dd>
        <dt>What a strong entry looks like</dt><dd>${esc(d.strong || "")}</dd>
        <dt>Rough time to prepare</dt><dd>${esc(d.hours || "")}</dd>
        <dt>Examples from past competitors</dt><dd>${ex}</dd>
      </dl>
      <div class="muted small">Official rules and rubric: <a href="${GUIDELINES_URL}" target="_blank" rel="noopener">BPA WSAP guidelines</a> (member login). Details above are a summary, not the official rubric.</div>
    </details></div>`;
}

function results() {
  const top = match(answers);
  app.innerHTML = `<h2>Your top picks</h2><p>Tap "More about this event" on any card to see what you'd actually make and what wins.</p>
    ${top.map(t => card(t.e, t.why.length ? t.why.slice(0,4).join(", ") : "closest overall fit")).join("")}
    <button class="btn primary" id="all">Show all events</button>
    <button class="btn ghost" id="again">Start over</button>`;
  document.getElementById("all").onclick = () => showAll(results);
  document.getElementById("again").onclick = landing;
  window.scrollTo(0,0);
}

function showAll(back) {
  let html = `<h2>All events</h2><p>${VISIBLE.length} events open to high school students.</p>`;
  let cat = null;
  for (const e of VISIBLE) {
    if (e.category !== cat) { cat = e.category; html += `<div class="cat">${esc(cat)}</div>`; }
    html += card(e, null);
  }
  html += `<button class="btn ghost" id="back">Back</button>`;
  app.innerHTML = html; window.scrollTo(0,0);
  document.getElementById("back").onclick = () => { back(); window.scrollTo(0,0); };
}

landing();
</script>
</body>
</html>
